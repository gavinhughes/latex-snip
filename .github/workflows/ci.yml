name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Cache built-in model
        uses: actions/cache@v4
        with:
          path: Models
          key: texo-${{ hashFiles('scripts/fetch-model.sh') }}
      - name: Fetch built-in model
        run: ./scripts/fetch-model.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
