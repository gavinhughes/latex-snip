# Two model slots. Enabled slots are tried in `order`;
# the second is backup if the first fails (network / HTTP / timeout / empty).
models:
  order: [online, offline]   # or [offline, online]
  online:
    enabled: true
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-2.5-flash
    api_key_env: OPENROUTER_API_KEY
    # Falls back to ~/.authinfo (machine openrouter.ai login apikey)
    timeout_s: 120
    temperature: 0
  offline:
    enabled: false
    # Local OpenAI-compatible (Ollama default). LM Studio is often :1234/v1
    base_url: http://127.0.0.1:11434/v1
    model: llama3.2-vision
    timeout_s: 120
    temperature: 0

hotkey:
  enabled: true
  flags: [cmd, shift]
  key: l

delimiters:
  preset: display_dollar
  open: "$$"
  close: "$$"
  ask: none

notify: true
show_dock_icon: false
